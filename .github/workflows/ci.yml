# Test a ogni push su main e a ogni PR.
#
# Linux: suite completa con ffmpeg, pandoc e LibreOffice installati (i test che
# li richiedono non vengono saltati). Windows: la stessa suite senza tool esterni,
# per i problemi di percorsi/encoding/Qt che si vedono solo lì. La build
# PyInstaller + selftest dell'exe sta in build-windows.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System tools (ffmpeg, pandoc, LibreOffice, Qt runtime libs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            ffmpeg pandoc libreoffice-writer fonts-dejavu-core fonts-crosextra-carlito \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt "pytest>=8.0" "ruff>=0.6" "lxml>=5"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        # -rs elenca i test saltati: una corsa verde che salta audio/video/documenti
        # non dimostra nulla, il riepilogo lo rende visibile nel log.
        run: python -m pytest -q -rs

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt "pytest>=8.0" "ruff>=0.6" "lxml>=5"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs
