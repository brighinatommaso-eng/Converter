# Build Windows: exe PyInstaller + selftest + zip portable + installer.
#
# - Su un tag v*      → crea una release in BOZZA con zip, setup.exe e SHA256.
#                       La pubblica una persona dopo averla controllata.
# - Su PR che toccano il packaging, o a mano → stessa build e stessi controlli,
#   i file finiscono negli artifact del run, nessuna release.
#
# La release non parte se: la versione del tag non coincide col codice, il
# selftest dell'exe fallisce, l'installer non installa/avvia/disinstalla pulito.
name: Build Windows

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - converter.spec
      - converter_app.py
      - requirements.txt
      - version_info.txt
      - installer/**
      - licenses/**
      - .github/workflows/build-windows.yml
  workflow_dispatch:

permissions:
  contents: write   # solo per creare la bozza di release sui tag

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Version check
        id: version
        run: |
          $v = python -c "import converter; print(converter.__version__)"
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "versione non leggibile da converter/__init__.py" }
          $v = $v.Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Il tag $env:GITHUB_REF_NAME non coincide con __version__ = $v"
          }
          # L'exe mostra version_info.txt in Proprietà → Dettagli: deve dire lo stesso.
          if (-not (Select-String -Path version_info.txt -SimpleMatch "'$v.0'" -Quiet)) {
            throw "version_info.txt non riporta la versione $v.0"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Converter $v"

      - name: Python dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.10"

      - name: External tools (ffmpeg, pandoc, LibreOffice, Inno Setup)
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "tools"
          New-Item -ItemType Directory -Force $tools | Out-Null

          # ffmpeg/ffprobe: build "full" di gyan.dev, la stessa di winget Gyan.FFmpeg.
          # L'hash pubblicato accanto all'archivio viene verificato prima di usarlo.
          $base = "https://www.gyan.dev/ffmpeg/builds"
          $archive = Join-Path $tools "ffmpeg.7z"
          Invoke-WebRequest "$base/ffmpeg-release-full.7z" -OutFile $archive
          $expected = (Invoke-WebRequest "$base/ffmpeg-release-full.7z.sha256").Content.Trim().Split()[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected.ToUpper()) { throw "SHA256 di ffmpeg non corrisponde ($actual != $expected)" }
          7z x $archive "-o$tools\ffmpeg" -y | Out-Null
          $ffbin = (Get-ChildItem "$tools\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          if (-not $ffbin) { throw "ffmpeg.exe non trovato nell'archivio" }
          $ffbin >> $env:GITHUB_PATH

          # pandoc: ultima release ufficiale (jgm/pandoc), zip x86_64.
          gh release download --repo jgm/pandoc --pattern "pandoc-*-windows-x86_64.zip" --dir $tools
          if ($LASTEXITCODE -ne 0) { throw "download di pandoc fallito" }
          $pzip = Get-ChildItem $tools -Filter "pandoc-*-windows-x86_64.zip" | Select-Object -First 1
          Expand-Archive $pzip.FullName -DestinationPath "$tools\pandoc" -Force
          $pbin = (Get-ChildItem "$tools\pandoc" -Recurse -Filter pandoc.exe | Select-Object -First 1).DirectoryName
          $pbin >> $env:GITHUB_PATH

          # LibreOffice: NON va nel bundle, serve solo perché il selftest copra anche
          # le conversioni della modalità FULL. Inno Setup: compila l'installer.
          choco install libreoffice-fresh innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install fallito" }

      - name: Tool versions
        run: |
          ffmpeg -hide_banner -version | Select-Object -First 1
          pandoc --version | Select-Object -First 1
          $so = Get-Item "C:\Program Files\LibreOffice\program\soffice.exe" -ErrorAction SilentlyContinue
          if ($so) { "LibreOffice " + $so.VersionInfo.ProductVersion } else { "LibreOffice: not in the default folder" }
          exit 0   # pipe chiusa da Select-Object: il codice d'uscita di pandoc qui non conta

      - name: PyInstaller
        run: |
          pyinstaller converter.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller fallito" }
          if (Test-Path dist\Converter\_internal\torch) { throw "torch nel bundle: errore di packaging" }
          $mb = [math]::Round(((Get-ChildItem dist\Converter -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 0)
          Write-Host "Bundle: $mb MB"
          if ($mb -gt 1500) { throw "Bundle di $mb MB: troppo grande, probabile errore di packaging" }

      - name: Selftest (bundle)
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest-bundle.txt"
          $p = Start-Process dist\Converter\Converter.exe -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0 -or -not (Select-String $report -SimpleMatch "SELFTEST PASS" -Quiet)) {
            throw "selftest dell'exe fallito"
          }

      - name: Zip portable
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist\Converter -DestinationPath "dist\Converter-v$v-windows.zip" -CompressionLevel Optimal

      - name: Installer
        run: |
          $v = "${{ steps.version.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\converter.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fallito" }

      - name: Installer round-trip (install, selftest, uninstall)
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $dir = Join-Path $env:RUNNER_TEMP "ConverterInstalled"
          $setup = Start-Process "dist\Converter-v$v-setup.exe" -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`""
          if ($setup.ExitCode -ne 0) { throw "setup.exe uscito con $($setup.ExitCode)" }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Converter.lnk"
          if (-not (Test-Path $lnk)) { throw "collegamento nel menu Start mancante" }

          $report = Join-Path $env:RUNNER_TEMP "selftest-installed.txt"
          $p = Start-Process "$dir\Converter.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0 -or -not (Select-String $report -SimpleMatch "SELFTEST PASS" -Quiet)) {
            throw "selftest della copia installata fallito"
          }

          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "disinstallazione uscita con $($u.ExitCode)" }
          # unins000.exe si rilancia da una copia temporanea: aspetta che finisca davvero.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\Converter.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\Converter.exe") { throw "la disinstallazione ha lasciato Converter.exe" }
          if (Test-Path $lnk) { throw "la disinstallazione ha lasciato il collegamento" }

      - name: Checksums and release notes
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $files = "Converter-v$v-windows.zip", "Converter-v$v-setup.exe"
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash
            "$h  $f"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

          # Note: docs/releases/v<versione>.md. Una prima riga "# Titolo" diventa il
          # titolo della release; la sezione degli hash è generata qui.
          $notesFile = "docs\releases\v$v.md"
          $title = "v$v"
          $body = ""
          if (Test-Path $notesFile) {
            $body = Get-Content $notesFile -Raw -Encoding utf8
            if ($body -match '^\#\s+(.+?)\r?\n') {
              $title = $Matches[1].Trim()
              $body = $body.Substring($Matches[0].Length)
            }
            $cut = $body.IndexOf("## Verify the download")
            if ($cut -ge 0) { $body = $body.Substring(0, $cut) }
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            throw "manca $notesFile: scrivi le note prima di creare il tag"
          }
          $fence = '```'
          $body = $body.TrimEnd() + "`n`n## Verify the download`n`n$fence`n" + ($lines -join "`n") + "`n$fence`n"
          $body | Set-Content dist\RELEASE_NOTES.md -Encoding utf8
          "title=$title" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Converter-windows
          path: |
            dist/Converter-v*-windows.zip
            dist/Converter-v*-setup.exe
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          retention-days: 14

      - name: Draft release
        if: github.ref_type == 'tag'
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $assets = "dist\Converter-v$v-windows.zip", "dist\Converter-v$v-setup.exe", "dist\SHA256SUMS.txt"
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Run ripetuto sullo stesso tag: aggiorna i file, non duplica la release.
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            gh release edit $env:GITHUB_REF_NAME --title "$env:title" --notes-file dist\RELEASE_NOTES.md
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag `
              --title "$env:title" --notes-file dist\RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "creazione della release fallita" }
